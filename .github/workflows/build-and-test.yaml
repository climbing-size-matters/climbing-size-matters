name: Build and Test

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  build-and-test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      # checkout repo
      - uses: actions/checkout@v7
      # picks up pnpm version from package.json
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      # cache dependencies
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      # the actual checks we care about
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm compile
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      # bundled Chromium plus its Linux system libraries; --no-shell skips the
      # headless-only build, which channel: 'chromium' doesn't use
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps --no-shell chromium
      - name: E2E tests
        run: pnpm e2e
      # traces from failed tests; open with `pnpm exec playwright show-trace`
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
