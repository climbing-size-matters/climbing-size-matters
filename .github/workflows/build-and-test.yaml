name: Build and Test

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  build-and-test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      # checkout repo
      - uses: actions/checkout@v7
      # picks up pnpm version from package.json
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      # cache dependencies
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      # the actual checks we care about
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm compile
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
